name: study_group_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0' # Enforces modern Dart features like .withValues()

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.6.0
  google_sign_in: ^6.2.1
  provider: ^6.0.6
  google_fonts: ^6.1.0
  intl: ^0.19.0
  uuid: ^4.0.0
  fl_chart: ^0.69.0  # 🌟 Added for Study Hub analytics
  http: ^1.2.1        # 🌟 Added for AI Assistant service
  file_picker: ^8.0.0
  image_picker: ^1.1.0
  cloudinary_public: ^0.23.1   # uploads files to Cloudinary
  url_launcher: ^6.3.0         # to open/view files later

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0 # Cleaned linting rule boundaries

flutter:
  uses-material-design: true